<!DOCTYPE html>
<html>
<head>
<title>Pragmatic Style Slot Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
  background:black;
  color:white;
  font-family:Arial;
  text-align:center;
  padding-top:10px;
}
h1{color:gold;}

.panel{
  background:#111;
  padding:8px;
  border:2px solid gold;
  border-radius:8px;
  width:360px;
  margin:auto;
}

.slot-container{
  position:relative;
  width:360px;
  height:180px;
  margin:auto;
  border:3px solid gold;
  background:black;
  overflow:hidden;
  display:flex;
}

.reel{
  width:120px;
  height:180px;
  border-left:2px solid red;
  font-size:50px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  transition:transform 0.3s;
}

.payline{
  position:absolute;
  top:90px;
  width:100%;
  height:2px;
  background:yellow;
}

button{
  padding:10px 20px;
  margin:5px;
  font-size:16px;
  background:red;
  color:white;
  border:none;
  border-radius:8px;
}
button:hover{background:darkred;}

.winFlash{
  animation:flash 0.2s infinite;
}
@keyframes flash{
  0%{box-shadow:0 0 10px gold;}
  50%{box-shadow:0 0 30px gold;}
  100%{box-shadow:0 0 10px gold;}
}
</style>
</head>
<body>

<h1>🎰 PRAGMATIC SLOT DEMO 🎰</h1>

<div class="panel">
Saldo: <span id="coin">10000</span> | Bet: <span id="bet">100</span>
</div>

<div class="slot-container" id="machine">
  <div class="payline"></div>
  <div class="reel" id="r1">🍒</div>
  <div class="reel" id="r2">🍋</div>
  <div class="reel" id="r3">⭐</div>
</div>

<button onclick="spin()">SPIN</button>
<button onclick="betPlus()">BET +</button>
<button onclick="betMinus()">BET -</button>
<button onclick="turboSpin()">TURBO</button>
<button onclick="resetGame()">RESET</button>

<script>
const symbols=["🍒","🍋","⭐","💎","7️⃣","🍉","🍇"];
let coin = localStorage.getItem("coin")?parseInt(localStorage.getItem("coin")):10000;
let bet=100;
let turbo=false;

updateUI();

function updateUI(){
  document.getElementById("coin").innerHTML=coin;
  document.getElementById("bet").innerHTML=bet;
  localStorage.setItem("coin",coin);
}

function randomSymbol(){
  return symbols[Math.floor(Math.random()*symbols.length)];
}

function spin(){
  if(coin<bet){alert("Saldo habis!");return;}
  coin-=bet;
  updateUI();

  let reels=["r1","r2","r3"];
  let speed= turbo?40:120;

  let interval=setInterval(()=>{
    reels.forEach(id=>{
      document.getElementById(id).innerHTML=randomSymbol();
    });
  },speed);

  setTimeout(()=>{
    clearInterval(interval);

    let a=randomSymbol();
    let b=randomSymbol();
    let c=randomSymbol();

    document.getElementById("r1").innerHTML=a;
    document.getElementById("r2").innerHTML=b;
    document.getElementById("r3").innerHTML=c;

    let machine=document.getElementById("machine");
    machine.classList.remove("winFlash");

    if(a==b && b==c){
      let win=bet*20;
      coin+=win;
      updateUI();
      machine.classList.add("winFlash");
      alert("🔥 BIG WIN "+win+" COIN!");
      setTimeout(()=>machine.classList.remove("winFlash"),2000);
    }

  },1000);
}

function betPlus(){ bet+=100; updateUI();}
function betMinus(){ if(bet>100){bet-=100; updateUI();}}

function turboSpin(){
  turbo=!turbo;
  alert(turbo?"TURBO ON":"TURBO OFF");
}

function resetGame(){
  coin=10000;
  bet=100;
  updateUI();
}
</script>

</body>
</html>
