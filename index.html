<!DOCTYPE html>
<html>
<head>
<title>Slot Coin PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  font-family: Arial;
  text-align:center;
  background:linear-gradient(180deg,#000,#300);
  color:white;
  padding-top:20px;
}
h1 {color:gold;}
.slot-box {
  font-size:70px;
  background:black;
  padding:20px;
  border:3px solid gold;
  border-radius:15px;
  display:inline-block;
  width:250px;
}
button {
  padding:15px 30px;
  font-size:20px;
  background:red;
  color:white;
  border:none;
  border-radius:10px;
  margin-top:15px;
}
button:hover {background:darkred;}
</style>
</head>
<body>

<h1>🎰 SLOT COIN PRO 🎰</h1>
<h2>💰 Coin: <span id="coin">100</span></h2>

<div class="slot-box" id="slot">🍒 🍋 ⭐</div>

<br>
<button onclick="spin()">SPIN (5 Coin)</button>
<button onclick="resetCoin()">RESET COIN</button>

<script>
let symbols = ["🍒","🍋","⭐","💎","7️⃣"];

let coin = localStorage.getItem("coin") ? parseInt(localStorage.getItem("coin")) : 100;
document.getElementById("coin").innerHTML = coin;

function spin(){
  if(coin < 5){
    alert("Coin habis!");
    return;
  }

  coin -= 5;

  let slot = document.getElementById("slot");
  let interval = setInterval(()=>{
    slot.innerHTML =
      symbols[Math.floor(Math.random()*symbols.length)]+" "+
      symbols[Math.floor(Math.random()*symbols.length)]+" "+
      symbols[Math.floor(Math.random()*symbols.length)];
  },100);

  setTimeout(()=>{
    clearInterval(interval);

    let a = symbols[Math.floor(Math.random()*symbols.length)];
    let b = symbols[Math.floor(Math.random()*symbols.length)];
    let c = symbols[Math.floor(Math.random()*symbols.length)];

    slot.innerHTML = a+" "+b+" "+c;

    if(a==b && b==c){
      alert("🎉 JACKPOT! +50 Coin");
      coin += 50;
    }

    saveCoin();
  },1000);
}

function saveCoin(){
  document.getElementById("coin").innerHTML = coin;
  localStorage.setItem("coin", coin);
}

function resetCoin(){
  coin = 100;
  saveCoin();
  alert("Coin reset ke 100");
}
</script>

</body>
</html>
