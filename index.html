<!DOCTYPE html>
<html>
<head>
<title>Ultra Real Casino Slot</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
  margin:0;
  background:black;
  color:white;
  font-family:Arial;
  text-align:center;
}
.top{
  background:#111;
  padding:8px;
  border-bottom:2px solid gold;
  font-size:14px;
}
.slot-bg{
  width:100%;
  max-width:400px;
  margin:auto;
  background:linear-gradient(#000,#200);
  border:3px solid gold;
  padding:5px;
}
.reels{
  display:flex;
  height:200px;
  overflow:hidden;
  background:black;
}
.reel{
  width:33.3%;
  border-left:2px solid red;
  position:relative;
}
.symbol{
  width:100%;
  height:65px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid #333;
}
.symbol img{
  width:50px;
  height:50px;
}
.payline{
  position:absolute;
  top:100px;
  width:100%;
  height:2px;
  background:yellow;
}
.controls{
  background:#111;
  padding:10px;
}
button{
  padding:12px 20px;
  margin:5px;
  font-size:14px;
  background:red;
  color:white;
  border:none;
  border-radius:8px;
}
button:hover{background:darkred;}

.bigwin{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:gold;
  font-size:40px;
}

.flash{
  animation:flash 0.2s infinite;
}
@keyframes flash{
  0%{box-shadow:0 0 10px gold;}
  50%{box-shadow:0 0 40px gold;}
  100%{box-shadow:0 0 10px gold;}
}
</style>
</head>
<body>

<div class="top">
💰 Saldo: <span id="coin">50000</span> | 🎯 Bet: <span id="bet">500</span> | 🎁 FreeSpin: <span id="fs">0</span>
</div>

<div class="slot-bg" id="machine">
<div class="payline"></div>
<div class="reels">
  <div class="reel" id="r1"></div>
  <div class="reel" id="r2"></div>
  <div class="reel" id="r3"></div>
</div>
</div>

<div class="controls">
<button onclick="spin()">SPIN</button>
<button onclick="betPlus()">BET +</button>
<button onclick="betMinus()">BET -</button>
<button onclick="turbo()">TURBO</button>
<button onclick="resetGame()">RESET</button>
</div>

<div class="bigwin" id="bigwin">
  <div>🔥 BIG WIN 🔥</div>
  <div id="winCount">0</div>
</div>

<script>
// SIMBOL GAMBAR (pakai URL icon gratis)
const symbols=[
"https://img.icons8.com/color/96/cherry.png",
"https://img.icons8.com/color/96/lemon.png",
"https://img.icons8.com/color/96/star.png",
"https://img.icons8.com/color/96/diamond.png",
"https://img.icons8.com/color/96/seven.png",
"https://img.icons8.com/color/96/gift.png" // scatter
];

let coin= localStorage.getItem("coin")?parseInt(localStorage.getItem("coin")):50000;
let bet=500;
let freeSpin=0;
let turboMode=false;

function updateUI(){
  document.getElementById("coin").innerHTML=coin;
  document.getElementById("bet").innerHTML=bet;
  document.getElementById("fs").innerHTML=freeSpin;
  localStorage.setItem("coin",coin);
}

function rand(){ return symbols[Math.floor(Math.random()*symbols.length)]; }

function drawReel(id){
  let html="";
  for(let i=0;i<3;i++){
    html+=`<div class='symbol'><img src='${rand()}'></div>`;
  }
  document.getElementById(id).innerHTML=html;
}

function spin(){
  if(freeSpin==0){
    if(coin<bet){alert("Saldo habis");return;}
    coin-=bet;
  } else freeSpin--;

  updateUI();
  let speed= turboMode?40:120;

  let interval=setInterval(()=>{
    drawReel("r1"); drawReel("r2"); drawReel("r3");
  },speed);

  setTimeout(()=>{
    clearInterval(interval);

    let a=rand(), b=rand(), c=rand();
    document.getElementById("r1").innerHTML=`<div class='symbol'><img src='${a}'></div>`;
    document.getElementById("r2").innerHTML=`<div class='symbol'><img src='${b}'></div>`;
    document.getElementById("r3").innerHTML=`<div class='symbol'><img src='${c}'></div>`;

    // SCATTER FREE SPIN
    if(a.includes("gift")||b.includes("gift")||c.includes("gift")){
      freeSpin+=5;
      alert("🎁 SCATTER! +5 FREE SPIN");
    }

    // WIN
    if(a==b && b==c){
      let win=bet*20;
      showBigWin(win);
    }

    updateUI();
  },1000);
}

function showBigWin(amount){
  let box=document.getElementById("bigwin");
  let counter=document.getElementById("winCount");
  box.style.display="flex";
  let t=0;
  let i=setInterval(()=>{
    t+=bet;
    counter.innerHTML=t;
    if(t>=amount){
      clearInterval(i);
      coin+=amount;
      updateUI();
      setTimeout(()=>box.style.display="none",2000);
    }
  },50);
}

function betPlus(){bet+=500; updateUI();}
function betMinus(){if(bet>500){bet-=500; updateUI();}}
function turbo(){turboMode=!turboMode; alert(turboMode?"TURBO ON":"TURBO OFF");}
function resetGame(){coin=50000; bet=500; freeSpin=0; updateUI();}

updateUI();
</script>

</body>
</html>
