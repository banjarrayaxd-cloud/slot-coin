<!DOCTYPE html>
<html>
<head>
<title>PG Slot Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {font-family:Arial;background:#111;color:#fff;text-align:center;padding:20px;}
#game {display:none;}
input,button {padding:10px;font-size:16px;margin:5px;border-radius:5px;border:none;}
button {background:red;color:white;font-weight:bold;}
.slot-box {font-size:40px;background:black;padding:15px;margin:10px;border:2px solid gold;display:inline-block;}
</style>
</head>

<body>

<h2>🎰 PG SLOT DEMO</h2>

<!-- FORM DAFTAR -->
<div id="form">
<h3>Daftar dulu untuk masuk demo</h3>
<input type="text" id="nama" placeholder="Nama"><br>
<input type="tel" id="hp" placeholder="No HP"><br>
<button onclick="masuk()">MASUK DEMO</button>
</div>

<!-- GAME SLOT -->
<div id="game">
<h3>Saldo Demo: <span id="saldo">1000</span> Koin</h3>

<div class="slot-box" id="s1">🍒</div>
<div class="slot-box" id="s2">🍋</div>
<div class="slot-box" id="s3">🔔</div><br>

<button onclick="spin()">SPIN</button>
</div>

<script>
function masuk(){
  let nama=document.getElementById("nama").value;
  let hp=document.getElementById("hp").value;
  if(nama=="" || hp==""){alert("Isi nama dan no HP dulu");return;}
  
  alert("Selamat datang "+nama+"!");
  document.getElementById("form").style.display="none";
  document.getElementById("game").style.display="block";
}

// SLOT ENGINE
let simbol=["🍒","🍋","🔔","💎","🍉"];
function spin(){
 let s1=simbol[Math.floor(Math.random()*simbol.length)];
 let s2=simbol[Math.floor(Math.random()*simbol.length)];
 let s3=simbol[Math.floor(Math.random()*simbol.length)];
 document.getElementById("s1").innerHTML=s1;
 document.getElementById("s2").innerHTML=s2;
 document.getElementById("s3").innerHTML=s3;

 let saldo=parseInt(document.getElementById("saldo").innerHTML);
 saldo-=10;
 if(s1==s2 && s2==s3){
   alert("WIN!!!");
   saldo+=100;
 }
 document.getElementById("saldo").innerHTML=saldo;
}
</script>

</body>
</html>
