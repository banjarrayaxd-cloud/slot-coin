<!DOCTYPE html>
<html>
<head>
<title>Slot Online Demo PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
  background:radial-gradient(circle,#000,#200);
  color:white;
  font-family:Arial;
  text-align:center;
  padding-top:10px;
}
h1{color:gold;font-size:24px;}

.panel{
  background:#111;
  padding:10px;
  border:2px solid gold;
  border-radius:10px;
  width:320px;
  margin:auto;
}

.slot{
  display:flex;
  justify-content:center;
  gap:5px;
  background:black;
  padding:10px;
  border:3px solid gold;
  border-radius:10px;
  margin:10px auto;
  width:300px;
  height:120px;
  overflow:hidden;
}

.reel{
  width:90px;
  height:100px;
  background:#000;
  border:2px solid red;
  border-radius:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:50px;
}

button{
  padding:10px 20px;
  font-size:16px;
  background:red;
  color:white;
  border:none;
  border-radius:8px;
  margin:5px;
}
button:hover{background:darkred;}

.win{
  box-shadow:0 0 20px gold;
}

</style>
</head>
<body>

<h1>🎰 SLOT ONLINE DEMO 🎰</h1>

<div class="panel">
💰 Saldo: <span id="coin">1000</span>  
| 🎯 Bet: <span id="bet">10</span>
</div>

<div class="slot" id="machine">
  <div class="reel" id="r1">🍒</div>
  <div class="reel" id="r2">🍋</div>
  <div class="reel" id="r3">⭐</div>
</div>

<button onclick="spin()">SPIN</button>
<button onclick="betPlus()">BET +</button>
<button onclick="betMinus()">BET -</button>
<button onclick="autoSpin()">AUTO</button>
<button onclick="resetGame()">RESET</button>

<script>
const symbols = ["🍒","🍋","⭐","💎","7️⃣"];
let coin = localStorage.getItem("coin") ? parseInt(localStorage.getItem("coin")) : 1000;
let bet = 10;
let auto=false;

updateUI();

function updateUI(){
  document.getElementById("coin").innerHTML=coin;
  document.getElementById("bet").innerHTML=bet;
  localStorage.setItem("coin",coin);
}

function spin(){
  if(coin<bet){ alert("Saldo habis!"); return;}
  coin -= bet;
  updateUI();

  let reels=["r1","r2","r3"];
  let interval=setInterval(()=>{
    reels.forEach(id=>{
      document.getElementById(id).innerHTML=symbols[Math.floor(Math.random()*symbols.length)];
    });
  },80);

  setTimeout(()=>{
    clearInterval(interval);

    let a=symbols[Math.floor(Math.random()*symbols.length)];
    let b=symbols[Math.floor(Math.random()*symbols.length)];
    let c=symbols[Math.floor(Math.random()*symbols.length)];

    document.getElementById("r1").innerHTML=a;
    document.getElementById("r2").innerHTML=b;
    document.getElementById("r3").innerHTML=c;

    let machine=document.getElementById("machine");
    machine.classList.remove("win");

    if(a==b && b==c){
      let win = bet*10;
      coin += win;
      machine.classList.add("win");
      alert("🎉 WIN "+win+" COIN!");
    }

    updateUI();
  },1000);
}

function betPlus(){ bet+=10; }
function betMinus(){ if(bet>10) bet-=10; }

function autoSpin(){
  auto=!auto;
  if(auto){
    alert("AUTO SPIN ON");
    autoLoop();
  } else {
    alert("AUTO SPIN OFF");
  }
}

function autoLoop(){
  if(!auto) return;
  spin();
  setTimeout(autoLoop,1500);
}

function resetGame(){
  coin=1000;
  bet=10;
  updateUI();
}
</script>

</body>
</html>
