<!DOCTYPE html>
<html>
<head>
<title>Ultra Real Slot Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
  background:#000;
  font-family:Arial;
  color:white;
  text-align:center;
}
h1{color:gold;font-size:20px;}

.topbar{
  background:#111;
  padding:8px;
  border-bottom:2px solid gold;
}

.slot-wrap{
  width:360px;
  margin:auto;
  border:3px solid gold;
  background:black;
  position:relative;
}

.reels{
  display:flex;
  height:200px;
  overflow:hidden;
}

.reel{
  width:120px;
  height:200px;
  border-left:2px solid red;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:40px;
  font-weight:bold;
  background:#000;
}

.symbol{
  width:80px;
  height:80px;
  background:#222;
  border:2px solid gold;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:3px;
}

.payline{
  position:absolute;
  top:100px;
  width:100%;
  height:2px;
  background:yellow;
}

.controls{
  background:#111;
  padding:10px;
}

button{
  padding:10px 18px;
  margin:5px;
  font-size:14px;
  background:red;
  color:white;
  border:none;
  border-radius:6px;
}
button:hover{background:darkred;}

.bigwin{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  color:gold;
  font-size:40px;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

.flash{
  animation:flash 0.2s infinite;
}
@keyframes flash{
  0%{box-shadow:0 0 10px gold;}
  50%{box-shadow:0 0 40px gold;}
  100%{box-shadow:0 0 10px gold;}
}
</style>
</head>
