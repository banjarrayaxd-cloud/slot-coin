<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gates of Olympus Super Real</title>
<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background: linear-gradient(#2b004d, #000);
  color: white;
  text-align:center;
  overflow:hidden;
}

/* BACKGROUND */
.bg {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: url('https://i.imgur.com/8KQ6gK7.png') no-repeat center center;
  background-size: cover;
  z-index:-2;
}

/* LIGHTNING */
.lightning {
  position:fixed;
  width:100%; height:100%;
  background:white;
  opacity:0;
  animation:flash 8s infinite;
  z-index:-1;
}
@keyframes flash {
  0%,95%,100%{opacity:0;}
  96%{opacity:0.8;}
  97%{opacity:0;}
  98%{opacity:0.6;}
  99%{opacity:0;}
}

/* TOP BAR */
.top {
  background: rgba(50,0,80,0.8);
  padding:10px;
  display:flex;
  justify-content:space-between;
  font-size:14px;
  border-bottom:3px solid gold;
}
.logo { color: gold; font-weight:bold; font-size:18px; }

/* SLOT MACHINE */
.machine { margin: 20px auto; width: 360px; height: 240px; display:flex; justify-content:center; align-items:center; border:4px solid gold; border-radius:12px; background: rgba(0,0,0,0.6); overflow:hidden; }
.reel { width:72px; margin:0 2px; border-left:2px solid purple; position:relative; overflow:hidden; height:100%; }
.symbol { font-size:50px; height:80px; display:flex; justify-content:center; align-items:center; }

/* CONTROLS */
.controls { margin-top:10px; }
button { padding:10px 20px; margin:5px; font-size:14px; background: gold; border:none; border-radius:8px; }
button:hover { background: orange; }

/* BIG WIN */
.bigwin {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.95);
  display:flex; justify-content:center; align-items:center; flex-direction:column;
  font-size:50px; color:gold; text-shadow:0 0 20px gold;
  display:none;
}

/* MULTIPLIER DROP */
.multi {
  position:fixed; top:-50px;
  font-size:40px; color: gold; text-shadow: 0 0 15px gold;
  animation:drop 2s linear forwards;
}
@keyframes drop { to{top:100%;} }

/* ZEUS ICON */
.zeus { position:fixed; bottom:0; right:0; font-size:100px; opacity:0.3; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="lightning"></div>

<div class="top">
  <div class="logo">⚡ Gates of Olympus Super Real ⚡</div>
  <div>
    💰 <span id="coin">100000</span> | 🎯 Bet: <span id="bet">1000</span> | FS: <span id="fs">0</span>
  </div>
</div>

<div class="machine">
  <div class="reel" id="r1"></div>
  <div class="reel" id="r2"></div>
  <div class="reel" id="r3"></div>
  <div class="reel" id="r4"></div>
  <div class="reel" id="r5"></div>
</div>

<div class="controls">
  <button onclick="spin()">SPIN</button>
  <button onclick="autoSpin()">AUTO</button>
  <button onclick="betPlus()">BET +</button>
  <button onclick="betMinus()">BET -</button>
  <button onclick="resetGame()">RESET</button>
</div>

<div class="bigwin" id="bigwin">
🔥 BIG WIN 🔥
<div id="winCount">0</div>
</div>

<div class="zeus">⚡</div>

<!-- SOUND -->
<audio id="spinSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_6a2b5b52c1.mp3"></audio>
<audio id="winSound" src="https://cdn.pixabay.com/download/audio/2021/09/02/audio_2f7c84a5a4.mp3"></audio>

<script>
const symbols=["⚡","💎","🔱","🍇","🔔","💰","⭐"];
const multipliers=[2,5,10,50,100];

let coin = 100000;
let bet = 1000;
let freeSpin = 0;
let auto=false;

function updateUI(){
  document.getElementById("coin").innerHTML=coin;
  document.getElementById("bet").innerHTML=bet;
  document.getElementById("fs").innerHTML=freeSpin;
}

function rand(){ return symbols[Math.floor(Math.random()*symbols.length)]; }

function buildReel(id){
  let html="";
  for(let i=0;i<20;i++){
    html+=`<div class="symbol">${rand()}</div>`;
  }
  document.getElementById(id).innerHTML=html;
}

function drawAll(){
  for(let i=1;i<=5;i++) buildReel("r"+i);
}

function spin(){
  document.getElementById("spinSound").play();

  if(freeSpin==0){
    if(coin<bet){ alert("Saldo habis"); return; }
    coin -= bet;
  } else freeSpin--;

  drawAll();
  updateUI();

  // Scatter Free Spin
  if(Math.random()<0.1){ freeSpin+=10; alert("🎁 FREE SPIN +10"); }

  // Multiplier
  if(Math.random()<0.3){
    let m = multipliers[Math.floor(Math.random()*multipliers.length)];
    dropMultiplier(m);
    let win = bet*m;
    showBigWin(win);
  }
}

function dropMultiplier(m){
  let d=document.createElement("div");
  d.className="multi";
  d.innerHTML="x"+m;
  d.style.left=Math.random()*80+"%";
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),2000);
}

function showBigWin(amount){
  document.getElementById("winSound").play();
  let box=document.getElementById("bigwin");
  let counter=document.getElementById("winCount");
  box.style.display="flex";
  let t=0;
  let i=setInterval(()=>{
    t+=bet;
    counter.innerHTML=t;
    if(t>=amount){ clearInterval(i); coin+=amount; updateUI(); setTimeout(()=>box.style.display="none",2000);}
  },30);
}

function betPlus(){ bet+=1000; updateUI(); }
function betMinus(){ if(bet>1000){ bet-=1000; updateUI(); } }
function resetGame(){ coin=100000; bet=1000; freeSpin=0; updateUI(); }

function autoSpin(){
  auto = !auto;
  alert(auto?"AUTO ON":"AUTO OFF");
  if(auto){
    let loop = setInterval(()=>{
      if(!auto){clearInterval(loop);}
      spin();
    },1500);
  }
}

drawAll();
updateUI();
</script>
</body>
</html>
