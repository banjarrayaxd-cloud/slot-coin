<!DOCTYPE html>
<html>
<head>
<title>Olympus Ultra Slot</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
  margin:0;
  background:black;
  color:white;
  font-family:Arial;
  overflow:hidden;
}

/* BACKGROUND VIDEO */
video{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  object-fit:cover;
  z-index:-2;
}

/* TOP BAR */
.top{
  background:rgba(50,0,80,0.7);
  padding:10px;
  border-bottom:2px solid gold;
  display:flex;
  justify-content:space-between;
  font-size:14px;
}
.logo{color:gold;font-size:20px;font-weight:bold;}

/* SLOT */
.machine{
  display:flex;
  justify-content:center;
  align-items:center;
  height:70vh;
}
.reels{
  display:flex;
  width:300px;
  height:240px;
  background:black;
  border:4px solid gold;
  border-radius:10px;
  overflow:hidden;
}
.reel{
  width:100px;
  border-left:2px solid purple;
  position:relative;
}
.symbol{
  font-size:40px;
  height:80px;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* CONTROLS */
.controls{
  text-align:center;
  padding:10px;
  background:#111;
}
button{
  padding:10px 20px;
  font-size:14px;
  background:gold;
  border:none;
  border-radius:8px;
  margin:5px;
}
button:hover{background:orange;}

/* ZEUS */
.zeus{
  position:fixed;
  bottom:0;
  right:0;
  font-size:80px;
  opacity:0.3;
}

/* BIG WIN */
.bigwin{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.95);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  font-size:50px;
  color:gold;
}
</style>
</head>
<body>

<!-- BACKGROUND VIDEO -->
<video autoplay muted loop>
<source src="https://cdn.coverr.co/videos/coverr-clouds-over-mountains-1712/1080p.mp4" type="video/mp4">
</video>

<div class="top">
<div class="logo">⚡ OLYMPUS ULTRA SLOT</div>
<div>
💰 <span id="coin">100000</span> |
🎯 Bet: <span id="bet">1000</span> |
📊 RTP: 96.5%
</div>
</div>

<div class="machine">
<div class="reels">
  <div class="reel" id="r1"></div>
  <div class="reel" id="r2"></div>
  <div class="reel" id="r3"></div>
</div>
</div>

<div class="controls">
<button onclick="spin()">SPIN</button>
<button onclick="autoSpin()">AUTO</button>
<button onclick="betPlus()">BET +</button>
<button onclick="betMinus()">BET -</button>
<button onclick="resetGame()">RESET</button>
</div>

<div class="bigwin" id="bigwin">
🔥 BIG WIN 🔥
<div id="winCount">0</div>
</div>

<div class="zeus">⚡</div>

<script>
const symbols=["⚡","💎","🔱","🍇","🔔","💰","⭐"];

let coin=100000;
let bet=1000;
let auto=false;

function rand(){return symbols[Math.floor(Math.random()*symbols.length)];}

function drawReel(id){
  let html="";
  for(let i=0;i<3;i++){
    html+=`<div class="symbol">${rand()}</div>`;
  }
  document.getElementById(id).innerHTML=html;
}

function updateUI(){
  document.getElementById("coin").innerHTML=coin;
  document.getElementById("bet").innerHTML=bet;
}

function spin(){
  if(coin<bet){alert("Saldo habis");return;}
  coin-=bet;
  updateUI();

  let speed=50;
  let interval=setInterval(()=>{
    drawReel("r1"); drawReel("r2"); drawReel("r3");
  },speed);

  setTimeout(()=>{
    clearInterval(interval);

    let a=rand(),b=rand(),c=rand();
    document.getElementById("r1").innerHTML=`<div class="symbol">${a}</div>`;
    document.getElementById("r2").innerHTML=`<div class="symbol">${b}</div>`;
    document.getElementById("r3").innerHTML=`<div class="symbol">${c}</div>`;

    if(a==b && b==c){
      showBigWin(bet*50);
    }
  },1200);
}

function showBigWin(amount){
  let box=document.getElementById("bigwin");
  let counter=document.getElementById("winCount");
  box.style.display="flex";
  let t=0;
  let i=setInterval(()=>{
    t+=bet;
    counter.innerHTML=t;
    if(t>=amount){
      clearInterval(i);
      coin+=amount;
      updateUI();
      setTimeout(()=>box.style.display="none",2000);
    }
  },30);
}

function betPlus(){bet+=1000;updateUI();}
function betMinus(){if(bet>1000){bet-=1000;updateUI();}}
function resetGame(){coin=100000;bet=1000;updateUI();}

function autoSpin(){
  auto=!auto;
  if(auto){
    let loop=setInterval(()=>{
      if(!auto){clearInterval(loop);}
      spin();
    },1500);
  }
}

drawReel("r1");drawReel("r2");drawReel("r3");
updateUI();
</script>

</body>
</html>
