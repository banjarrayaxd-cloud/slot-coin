<!DOCTYPE html>
<html>
<head>
<title>Banjar Raya Cel Casino</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
  margin:0;
  background:black;
  color:white;
  font-family:Arial;
}

/* TOP BAR */
.top{
  background:#800000;
  padding:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:14px;
  border-bottom:2px solid gold;
}
.logo{
  font-size:18px;
  font-weight:bold;
  color:white;
}
.info span{margin:0 5px;}

/* SLOT MACHINE */
.machine{
  display:flex;
  justify-content:center;
  align-items:center;
  height:80vh;
}
.slot-box{
  background:linear-gradient(#000,#300);
  border:4px solid gold;
  padding:10px;
  border-radius:15px;
  box-shadow:0 0 20px gold;
}

.reels{
  display:flex;
  width:450px;
  height:200px;
  overflow:hidden;
  background:black;
}
.reel{
  width:150px;
  border-left:2px solid red;
}
.symbol{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.symbol img{
  width:55px;
  height:55px;
}

/* CONTROLS */
.controls{
  text-align:center;
  background:#111;
  padding:10px;
  border-top:2px solid gold;
}
button{
  padding:10px 18px;
  margin:5px;
  font-size:14px;
  background:red;
  color:white;
  border:none;
  border-radius:8px;
}
button:hover{background:darkred;}

/* BIG WIN SCREEN */
.bigwin{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:gold;
  font-size:50px;
  text-shadow:0 0 20px gold;
}
</style>
</head>
<body>

<div class="top">
  <div class="logo">BANJAR RAYA CEL 🎰</div>
  <div class="info">
    💰 Saldo: <span id="coin">100000</span> |
    🎯 Bet: <span id="bet">1000</span> |
    🎁 FreeSpin: <span id="fs">0</span>
  </div>
</div>

<div class="machine">
<div class="slot-box">
<div class="reels">
  <div class="reel" id="r1"></div>
  <div class="reel" id="r2"></div>
  <div class="reel" id="r3"></div>
</div>
</div>
</div>

<div class="controls">
<button onclick="spin()">SPIN</button>
<button onclick="betPlus()">BET +</button>
<button onclick="betMinus()">BET -</button>
<button onclick="turbo()">TURBO</button>
<button onclick="resetGame()">RESET</button>
</div>

<div class="bigwin" id="bigwin">
🔥 BIG WIN 🔥<br>
<div id="winCount">0</div>
</div>

<!-- SOUND -->
<audio id="spinSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_6a2b5b52c1.mp3"></audio>
<audio id="winSound" src="https://cdn.pixabay.com/download/audio/2021/09/02/audio_2f7c84a5a4.mp3"></audio>

<script>
// simbol gambar
const symbols=[
"https://img.icons8.com/color/96/cherry.png",
"https://img.icons8.com/color/96/lemon.png",
"https://img.icons8.com/color/96/star.png",
"https://img.icons8.com/color/96/diamond.png",
"https://img.icons8.com/color/96/seven.png",
"https://img.icons8.com/color/96/gift.png" // scatter
];

let coin= localStorage.getItem("coin")?parseInt(localStorage.getItem("coin")):100000;
let bet=1000;
let freeSpin=0;
let turboMode=false;

function updateUI(){
  coin=Math.floor(coin);
  document.getElementById("coin").innerHTML=coin;
  document.getElementById("bet").innerHTML=bet;
  document.getElementById("fs").innerHTML=freeSpin;
  localStorage.setItem("coin",coin);
}

function rand(){return symbols[Math.floor(Math.random()*symbols.length)];}

function drawReel(id){
  let html="";
  for(let i=0;i<3;i++){
    html+=`<div class='symbol'><img src='${rand()}'></div>`;
  }
  document.getElementById(id).innerHTML=html;
}

function spin(){
  document.getElementById("spinSound").play();

  if(freeSpin==0){
    if(coin<bet){alert("Saldo habis");return;}
    coin-=bet;
  } else freeSpin--;

  updateUI();

  let speed= turboMode?30:120;
  let interval=setInterval(()=>{
    drawReel("r1"); drawReel("r2"); drawReel("r3");
  },speed);

  setTimeout(()=>{
    clearInterval(interval);

    let a=rand(), b=rand(), c=rand();
    document.getElementById("r1").innerHTML=`<div class='symbol'><img src='${a}'></div>`;
    document.getElementById("r2").innerHTML=`<div class='symbol'><img src='${b}'></div>`;
    document.getElementById("r3").innerHTML=`<div class='symbol'><img src='${c}'></div>`;

    // SCATTER FREE SPIN
    if(a.includes("gift")||b.includes("gift")||c.includes("gift")){
      freeSpin+=10;
      alert("🎁 SCATTER! +10 FREE SPIN");
    }

    // JACKPOT
    if(a==b && b==c){
      let win=bet*50;
      showBigWin(win);
    }

    updateUI();
  },1000);
}

function showBigWin(amount){
  document.getElementById("winSound").play();
  let box=document.getElementById("bigwin");
  let counter=document.getElementById("winCount");
  box.style.display="flex";
  let t=0;
  let i=setInterval(()=>{
    t+=bet*2;
    counter.innerHTML=t;
    if(t>=amount){
      clearInterval(i);
      coin+=amount;
      updateUI();
      setTimeout(()=>box.style.display="none",2500);
    }
  },50);
}

function betPlus(){bet+=1000; updateUI();}
function betMinus(){if(bet>1000){bet-=1000; updateUI();}}
function turbo(){turboMode=!turboMode; alert(turboMode?"⚡ TURBO ON":"TURBO OFF");}
function resetGame(){coin=100000; bet=1000; freeSpin=0; updateUI();}

updateUI();
</script>

</body>
</html>
