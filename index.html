<!DOCTYPE html>
<html>
<head>
<title>Olympus Slot Demo - Banjar Raya Cel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
  margin:0;
  background:linear-gradient(#1a0033,#000);
  color:white;
  font-family:Arial;
  text-align:center;
}

/* HEADER */
.top{
  background:purple;
  padding:10px;
  border-bottom:3px solid gold;
  font-size:14px;
  display:flex;
  justify-content:space-between;
}
.logo{
  font-size:20px;
  font-weight:bold;
  color:gold;
}

/* ZEUS PANEL */
.zeus{
  font-size:22px;
  color:gold;
  text-shadow:0 0 10px gold;
  margin-top:5px;
}

/* SLOT */
.slot-box{
  width:320px;
  margin:auto;
  border:4px solid gold;
  border-radius:15px;
  background:black;
  padding:10px;
  box-shadow:0 0 20px gold;
}
.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  grid-gap:5px;
}
.cell{
  background:#220044;
  border:2px solid purple;
  border-radius:8px;
  font-size:30px;
  padding:8px;
}

/* CONTROL */
.controls{
  margin-top:10px;
}
button{
  padding:10px 18px;
  font-size:14px;
  background:gold;
  border:none;
  border-radius:8px;
  margin:5px;
}
button:hover{background:orange;}

/* BIG WIN */
.bigwin{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.95);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  font-size:50px;
  color:gold;
  text-shadow:0 0 20px gold;
}
</style>
</head>
<body>

<div class="top">
  <div class="logo">⚡ OLYMPUS SLOT - BANJAR RAYA CEL</div>
  <div>💰 Saldo: <span id="coin">100000</span> | 🎯 Bet: <span id="bet">1000</span></div>
</div>

<div class="zeus">⚡ ZEUS POWER MODE ⚡</div>

<div class="slot-box">
<div class="grid" id="grid"></div>
</div>

<div class="controls">
<button onclick="spin()">SPIN</button>
<button onclick="betPlus()">BET +</button>
<button onclick="betMinus()">BET -</button>
<button onclick="autoSpin()">AUTO</button>
<button onclick="resetGame()">RESET</button>
</div>

<div class="bigwin" id="bigwin">
💥 BIG WIN 💥
<div id="winCount">0</div>
</div>

<script>
// simbol Gates style
const symbols=["⚡","💎","🔱","🍇","🔔","💰","⭐"];
let coin=100000;
let bet=1000;
let auto=false;

function updateUI(){
  document.getElementById("coin").innerHTML=coin;
  document.getElementById("bet").innerHTML=bet;
}

function rand(){return symbols[Math.floor(Math.random()*symbols.length)];}

function drawGrid(){
  let html="";
  for(let i=0;i<25;i++){
    html+=`<div class="cell">${rand()}</div>`;
  }
  document.getElementById("grid").innerHTML=html;
}

function spin(){
  if(coin<bet){alert("Saldo habis");return;}
  coin-=bet;
  updateUI();

  drawGrid();

  // jackpot random
  if(Math.random()<0.05){
    let win=bet*100;
    showBigWin(win);
  }
}

function showBigWin(amount){
  let box=document.getElementById("bigwin");
  let counter=document.getElementById("winCount");
  box.style.display="flex";
  let t=0;
  let i=setInterval(()=>{
    t+=bet*5;
    counter.innerHTML=t;
    if(t>=amount){
      clearInterval(i);
      coin+=amount;
      updateUI();
      setTimeout(()=>box.style.display="none",2000);
    }
  },50);
}

function betPlus(){bet+=1000;updateUI();}
function betMinus(){if(bet>1000){bet-=1000;updateUI();}}
function resetGame(){coin=100000;bet=1000;updateUI();}

function autoSpin(){
  auto=!auto;
  alert(auto?"AUTO ON":"AUTO OFF");
  if(auto){
    let loop=setInterval(()=>{
      if(!auto){clearInterval(loop);}
      spin();
    },1200);
  }
}

drawGrid();
updateUI();
</script>

</body>
</html>
