<!DOCTYPE html>
<html>
<head>
<title>Olympus Pro Max - Banjar Raya Cel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
  margin:0;
  background:linear-gradient(#2b004d,#000);
  color:white;
  font-family:Arial;
  text-align:center;
}

/* HEADER */
.top{
  background:#4b0066;
  padding:10px;
  border-bottom:3px solid gold;
  display:flex;
  justify-content:space-between;
  font-size:14px;
}
.logo{color:gold;font-size:20px;font-weight:bold;}

/* ZEUS */
.zeus{
  font-size:22px;
  color:gold;
  text-shadow:0 0 10px gold;
  margin:5px;
}

/* SLOT GRID */
.slot-box{
  width:360px;
  margin:auto;
  border:4px solid gold;
  border-radius:15px;
  background:black;
  padding:10px;
  box-shadow:0 0 20px gold;
}
.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
}
.cell{
  background:#200033;
  border:2px solid purple;
  border-radius:8px;
  font-size:30px;
  padding:10px;
}

/* MULTIPLIER DROP */
.multi{
  position:fixed;
  top:0;
  font-size:30px;
  color:gold;
  text-shadow:0 0 10px gold;
  animation:drop 2s linear forwards;
}
@keyframes drop{
  from{top:-50px;}
  to{top:100%;}
}

/* CONTROL */
.controls{margin-top:10px;}
button{
  padding:10px 18px;
  font-size:14px;
  background:gold;
  border:none;
  border-radius:8px;
  margin:5px;
}
button:hover{background:orange;}

/* BIG WIN */
.bigwin{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.95);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  font-size:50px;
  color:gold;
  text-shadow:0 0 20px gold;
}
</style>
</head>
<body>

<div class="top">
<div class="logo">⚡ OLYMPUS PRO MAX</div>
<div>
💰 Saldo: <span id="coin">100000</span> |
🎯 Bet: <span id="bet">1000</span> |
🎁 FS: <span id="fs">0</span>
</div>
</div>

<div class="zeus">⚡ ZEUS POWER ACTIVE ⚡</div>

<div class="slot-box">
<div class="grid" id="grid"></div>
</div>

<div class="controls">
<button onclick="spin()">SPIN</button>
<button onclick="autoSpin()">AUTO</button>
<button onclick="betPlus()">BET +</button>
<button onclick="betMinus()">BET -</button>
<button onclick="resetGame()">RESET</button>
</div>

<div class="bigwin" id="bigwin">
💥 BIG WIN 💥
<div id="winCount">0</div>
</div>

<script>
// SIMBOL
const symbols=["⚡","💎","🔱","🍇","🔔","💰","⭐"];
const multipliers=[2,5,10,50,100];

let coin= localStorage.getItem("coin")?parseInt(localStorage.getItem("coin")):100000;
let bet=1000;
let freeSpin=0;
let auto=false;

function updateUI(){
  document.getElementById("coin").innerHTML=coin;
  document.getElementById("bet").innerHTML=bet;
  document.getElementById("fs").innerHTML=freeSpin;
  localStorage.setItem("coin",coin);
}

function rand(){return symbols[Math.floor(Math.random()*symbols.length)];}

function drawGrid(){
  let html="";
  for(let i=0;i<25;i++){
    html+=`<div class="cell">${rand()}</div>`;
  }
  document.getElementById("grid").innerHTML=html;
}

function spin(){
  if(freeSpin==0){
    if(coin<bet){alert("Saldo habis");return;}
    coin-=bet;
  } else freeSpin--;

  drawGrid();
  updateUI();

  // scatter free spin
  if(Math.random()<0.08){
    freeSpin+=10;
    alert("🎁 FREE SPIN +10");
  }

  // multiplier drop
  if(Math.random()<0.3){
    let m=multipliers[Math.floor(Math.random()*multipliers.length)];
    dropMultiplier(m);
    let win=bet*m;
    showBigWin(win);
  }
}

function dropMultiplier(m){
  let d=document.createElement("div");
  d.className="multi";
  d.innerHTML="x"+m;
  d.style.left=Math.random()*80+"%";
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),2000);
}

function showBigWin(amount){
  let box=document.getElementById("bigwin");
  let counter=document.getElementById("winCount");
  box.style.display="flex";
  let t=0;
  let i=setInterval(()=>{
    t+=bet;
    counter.innerHTML=t;
    if(t>=amount){
      clearInterval(i);
      coin+=amount;
      updateUI();
      setTimeout(()=>box.style.display="none",2000);
    }
  },30);
}

function betPlus(){bet+=1000;updateUI();}
function betMinus(){if(bet>1000){bet-=1000;updateUI();}
}
function resetGame(){coin=100000;bet=1000;freeSpin=0;updateUI();}

function autoSpin(){
  auto=!auto;
  alert(auto?"AUTO SPIN ON":"AUTO SPIN OFF");
  if(auto){
    let loop=setInterval(()=>{
      if(!auto){clearInterval(loop);}
      spin();
    },1200);
  }
}

drawGrid();
updateUI();
</script>

</body>
</html>
