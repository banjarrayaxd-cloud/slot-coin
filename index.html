<!DOCTYPE html>
<html>
<head>
<title>Gates of Olympus SUPER REAL</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  margin:0;
  font-family:Arial;
  background:linear-gradient(#2b0040,#000);
  color:white;
  text-align:center;
}
h1 {color:gold;}
.slot {
  display:flex;
  justify-content:center;
  font-size:70px;
  margin-top:20px;
}
.reel {
  width:90px;
  height:90px;
  border:2px solid gold;
  margin:5px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:black;
  border-radius:10px;
}
button {
  padding:12px 25px;
  font-size:16px;
  background:gold;
  border:none;
  border-radius:8px;
  margin:5px;
}
button:hover {background:orange;}
.win {
  box-shadow:0 0 30px gold;
}
.bigwin {
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
  font-size:50px;
  color:gold;
  z-index:99;
}
</style>
</head>
<body>

<h1>⚡ GATES OF OLYMPUS DEMO ⚡</h1>
<h2>💰 Coin: <span id="coin">1000</span></h2>
<h3>🔥 Free Spins: <span id="free">0</span></h3>

<div class="slot" id="machine">
  <div class="reel" id="r1">🍒</div>
  <div class="reel" id="r2">🍋</div>
  <div class="reel" id="r3">⭐</div>
</div>

<button onclick="spin()">SPIN (10)</button>
<button onclick="buyFreeSpin()">BUY FREE SPIN (200)</button>
<button onclick="resetCoin()">RESET</button>

<div class="bigwin" id="bigwin">💰 BIG WIN!!!</div>

<!-- SOUND -->
<audio id="spinSound" src="https://cdn.pixabay.com/audio/2022/03/15/audio_3e8b7c8c3c.mp3"></audio>
<audio id="winSound" src="https://cdn.pixabay.com/audio/2022/03/10/audio_6d9e0e0b6c.mp3"></audio>

<script>
const symbols=["🍒","🍋","⭐","💎","7️⃣","⚡"];
let coin = localStorage.coin?parseInt(localStorage.coin):1000;
let free = localStorage.free?parseInt(localStorage.free):0;

update();

function update(){
 document.getElementById("coin").innerHTML=coin;
 document.getElementById("free").innerHTML=free;
 localStorage.coin=coin;
 localStorage.free=free;
}

function spin(){
 if(free>0){
   free--;
 } else {
   if(coin<10){alert("Coin habis");return;}
   coin-=10;
 }

 document.getElementById("spinSound").play();

 let reels=["r1","r2","r3"];
 let interval=setInterval(()=>{
  reels.forEach(r=>{
    document.getElementById(r).innerHTML=symbols[Math.floor(Math.random()*symbols.length)];
  });
 },100);

 setTimeout(()=>{
  clearInterval(interval);

  let a=symbols[Math.floor(Math.random()*symbols.length)];
  let b=symbols[Math.floor(Math.random()*symbols.length)];
  let c=symbols[Math.floor(Math.random()*symbols.length)];

  r1.innerHTML=a; r2.innerHTML=b; r3.innerHTML=c;

  let mult=[2,5,10,50,100];
  if(a=="⚡"||b=="⚡"||c=="⚡"){
    let m=mult[Math.floor(Math.random()*mult.length)];
    coin+=m*10;
    alert("⚡ MULTIPLIER x"+m);
  }

  if(a==b&&b==c){
    coin+=500;
    showBigWin();
  }

  update();
 },1200);
}

function buyFreeSpin(){
 if(coin<200){alert("Coin kurang");return;}
 coin-=200;
 free+=10;
 alert("🎁 Dapat 10 Free Spin!");
 update();
}

function resetCoin(){
 coin=1000;
 free=0;
 update();
}

function showBigWin(){
 let b=document.getElementById("bigwin");
 b.style.display="flex";
 document.getElementById("winSound").play();
 setTimeout(()=>{b.style.display="none";},2000);
}
</script>

</body>
</html>
